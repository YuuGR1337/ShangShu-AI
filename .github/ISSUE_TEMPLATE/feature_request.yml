name: 💡 特性建议
description: 提出新功能或改进建议
title: "[Feature] 简要描述建议"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索 [已有 Issue](../../issues?q=is%3Aissue) 与 [Roadmap](../../README.md#roadmap) 避免重复。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想解决什么问题？当前方式为什么不满足？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你期望的功能形态、交互或接口
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式或临时绕过方法？

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 工作流引擎
        - 知识库 RAG
        - Agent
        - AI 应用发布
        - 模型管理
        - Web 管理台
        - 部署 / 运维
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现该特性（可从 [Good First Issues](../docs/good-first-issues.md) 了解贡献流程）
